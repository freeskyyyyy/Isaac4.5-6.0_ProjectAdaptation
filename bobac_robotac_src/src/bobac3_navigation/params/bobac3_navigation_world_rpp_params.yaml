# Opt-in RPP recovery profile: actual short-goal acceptance only, long route/grasp pending.
# Native Isaac pose odom supports low motion noise; no ground-truth localization publisher.
# Initial pose below applies to a reset radius-candidate scene; reinitialize at other poses.
amcl:
  ros__parameters:
    use_sim_time: true
    alpha1: 0.001
    alpha2: 0.001
    alpha3: 0.001
    alpha4: 0.001
    alpha5: 0.001
    base_frame_id: base_link
    beam_skip_distance: 0.3
    beam_skip_error_threshold: 0.7
    beam_skip_threshold: 0.2
    do_beamskip: true
    global_frame_id: map
    lambda_short: 0.05
    laser_likelihood_max_dist: 8.0
    laser_max_range: 10.0
    laser_min_range: 0.1
    laser_model_type: likelihood_field
    max_beams: 360
    max_particles: 1500
    min_particles: 300
    odom_frame_id: odom
    pf_err: 0.005
    pf_z: 0.99
    recovery_alpha_fast: 0.001
    recovery_alpha_slow: 0.0005
    resample_interval: 3
    robot_model_type: nav2_amcl::OmniMotionModel
    save_pose_rate: 0.5
    sigma_hit: 0.05
    tf_broadcast: true
    tf_broadcast_particle_pose: true
    transform_tolerance: 5.0
    update_min_a: 0.1
    update_min_d: 0.15
    z_hit: 0.85
    z_max: 0.02
    z_rand: 0.08
    z_short: 0.05
    scan_topic: /laser_scan_fuse
    map_topic: map
    set_initial_pose: true
    always_reset_initial_pose: false
    first_map_only: false
    initial_pose:
      x: 7.999990895390511
      y: 1.0820035936354835
      z: 0.0
      yaw: -3.577751974137747e-05
amcl_map_client:
  ros__parameters:
    use_sim_time: true
amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: true
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: odom
    bt_loop_duration: 20
    default_server_timeout: 40
bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: true
velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: true
    feedback: CLOSED_LOOP
    max_velocity:
    - 0.08
    - 0.08
    - 0.15
    min_velocity:
    - -0.08
    - -0.08
    - -0.15
    max_accel:
    - 0.15
    - 0.15
    - 0.3
    max_decel:
    - -0.15
    - -0.15
    - -0.3
    velocity_timeout: 0.25
    odom_topic: odom
    odom_duration: 0.05
    max_odom_age: 0.15
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    enable_stamped_cmd_vel: false
controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.0
    odom_topic: odom
    goal_checker_plugins:
    - stopped_goal_checker
    controller_plugins:
    - FollowPath
    enable_stamped_cmd_vel: false
    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.08
      movement_time_allowance: 15.0
      required_movement_angle: 0.5
    stopped_goal_checker:
      plugin: nav2_controller::StoppedGoalChecker
      xy_goal_tolerance: 0.04
      yaw_goal_tolerance: 0.04
      stateful: true
      rot_stopped_velocity: 0.02
      trans_stopped_velocity: 0.015
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.04
      lookahead_dist: 0.05
      min_lookahead_dist: 0.1
      max_lookahead_dist: 0.1
      use_velocity_scaled_lookahead_dist: false
      rotate_to_heading_angular_vel: 0.08
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.15
      max_angular_accel: 0.3
      allow_reversing: false
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.5
      regulated_linear_scaling_min_speed: 0.005
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.8
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0
      min_approach_linear_velocity: 0.01
      approach_velocity_scaling_dist: 0.15
      transform_tolerance: 0.1
      stateful: true
    progress_checker_plugins:
    - progress_checker
controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: true
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 20.0
      publish_frequency: 20.0
      footprint_padding: 0.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 25
      height: 25
      resolution: 0.05
      transform_tolerance: 1.0
      always_send_full_costmap: true
      track_unknown_space: false
      use_maximum: false
      robot_radius: 0.64
      plugins:
      - world_static_layer
      - front_rplidar_obstacle_layer
      - inflation_layer
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: true
        cost_scaling_factor: 3.0
        inflation_radius: 0.85
      front_rplidar_obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /laser_scan_fuse
          sensor_frame: fuse_lidar_link
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.05
          expected_update_rate: 0.0
          inf_is_valid: false
        combination_method: 1
      world_static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /world_obstacles
        map_subscribe_transient_local: true
        subscribe_to_updates: false
  local_costmap_client:
    ros__parameters:
      use_sim_time: true
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: true
global_costmap:
  global_costmap:
    ros__parameters:
      footprint_padding: 0.0
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: true
      transform_tolerance: 5.0
      robot_radius: 0.64
      resolution: 0.05
      plugins:
      - world_static_layer
      - inflation_layer
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.85
      always_send_full_costmap: true
      world_static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /world_obstacles
        map_subscribe_transient_local: true
        subscribe_to_updates: false
      track_unknown_space: true
  global_costmap_client:
    ros__parameters:
      use_sim_time: true
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: true
map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ''
map_saver:
  ros__parameters:
    use_sim_time: true
    save_map_timeout: 5000
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true
planner_server:
  ros__parameters:
    expected_planner_frequency: 3.0
    use_sim_time: true
    planner_plugins:
    - GridBased
    GridBased:
      plugin: bobac3_navigation::ConnectedSmacPlanner2D
      tolerance: 0.05
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: false
      max_iterations: 1000000
      max_planning_time: 10.0
      max_on_approach_iterations: 1000
      terminal_checking_interval: 5000
      smoother:
        max_iterations: 0
        do_refinement: false
      use_final_approach_orientation: false
      cost_travel_multiplier: 2.0
planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: true
smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins:
    - simple_smoother
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true
behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 5.0
    behavior_plugins:
    - spin
    - backup
    - drive_on_heading
    - wait
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    wait:
      plugin: nav2_behaviors::Wait
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 1.0
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.3
    min_rotational_vel: 0.1
    rotational_acc_lim: 1.0
    enable_stamped_cmd_vel: false
waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200
