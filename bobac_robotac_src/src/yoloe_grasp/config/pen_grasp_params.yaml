# 针对平放在桌面上的笔的抓取参数配置
# 使用方法：ros2 run yoloe_grasp yoloe_grasp_node --ros-args --params-file pen_grasp_params.yaml

yoloe_grasp_node:
  ros__parameters:
    use_sim_time: true
    # 相机话题
    rgb_topic: '/arm_camera/rgb'
    depth_topic: '/arm_camera/depth'
    camera_info_topic: '/arm_camera/camera_info'
    # Isaac 发布端为 RELIABLE；可选 reliable / best_effort，仅覆盖可靠性
    rgb_qos_reliability: 'reliable'
    depth_qos_reliability: 'reliable'
    camera_info_qos_reliability: 'reliable'

    # 坐标系
    base_frame: 'base_link_arm'
    camera_frame: ''  # 使用配对 RGB 的 frame_id，不自动搜索其他相机
    camera_frame_convention: 'optical'  # ROS 消息契约；A 必须核验 arm_Camera 的真实 TF 轴
    # 若 TF 为原始 USD Camera 轴，A 确认后改为 usd；若发布 optical TF，保持 optical
    disable_optical_compensation: true  # 停用旧启发式旋转，改用上方显式约定
    sync_tolerance_sec: 0.05
    max_data_age_sec: 1.0
    tf_wait_timeout_sec: 0.2  # 固定原图 stamp 等待延迟 TF，墙钟上限；不使用 latest
    allow_static_camera_info: false  # CameraInfo 默认须与图像同步

    # YOLOE 模型配置
    model_path: 'yoloe-26l-seg.pt'
    classes: ['pencil', 'pen']
    conf: 0.01
    device: 'cuda:0'

    # 调试选项
    save_debug_images: true
    debug_image_dir: '/workspace/course/.runtime/vision/debug'

    # /detect_object Action 接口保持不变，超时采用墙钟

    # ===== 关键参数：法向量模式 =====
    # 对于平放在桌面上的笔，从上往下抓取，使用固定法向量
    normal_mode: 'fixed_base'  # 选项: 'fixed_base', 'local_plane', 'camera_side', 'fixed', 'pca'
    fixed_normal: [0.0, 0.0, -1.0]  # 向下的法向量（Z轴向下）

    # ===== 关键参数：长轴检测模式 =====
    # 使用 mask 的长轴来确定笔的方向
    axis_mode: 'mask_long'  # 'mask_long' 检测笔的长轴方向
    axis_step_px: 10  # 用于采样长轴方向的像素步长

    # local_plane 模式参数（如果使用 local_plane 模式）
    local_plane_radius_px: 15
    local_plane_depth_tol: 0.015  # 15mm 深度容差
    local_plane_min_points: 80
